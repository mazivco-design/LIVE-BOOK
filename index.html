<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ספר חי</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--ink:#3a2e2a;--ok:#2a9d5c;--accent:#f4a259;--warn:#e56b6f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);font-family:Rubik,Arial,sans-serif;color:var(--ink);overflow:hidden}
button{font-family:inherit;cursor:pointer}
.hidden{display:none !important}

/* ---- מסך הספרייה ---- */
#library{height:100%;overflow-y:auto;padding:28px 20px 40px}
#library h1{text-align:center;font-size:clamp(34px,6vw,56px);margin:0 0 6px;font-weight:800}
#library .sub{text-align:center;font-size:20px;opacity:.65;margin-bottom:28px}
.shelf{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.book{background:#fff;border:none;border-radius:24px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.09);padding:0;text-align:center;color:var(--ink);transition:transform .2s;position:relative}
.book:active{transform:scale(.96)}
.book .cover{aspect-ratio:4/3;display:block;width:100%}
.book .cover svg{width:100%;height:100%;display:block}
.book .name{display:block;font-size:26px;font-weight:800;padding:14px 10px 4px}
.book .meta{display:block;font-size:16px;opacity:.6;padding-bottom:16px}
.book .done{position:absolute;top:10px;left:10px;background:#fff;border-radius:20px;padding:4px 10px;font-size:16px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12)}

/* ---- מסך הקריאה ---- */
#reader{height:100%;display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px}
.top{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:600;gap:12px}
.home{width:52px;height:52px;border-radius:50%;border:none;background:#fff;font-size:26px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
#title{flex:1;text-align:center}
.stage{width:100%;max-width:900px;flex:1 1 auto;min-height:0;background:#fff;border-radius:28px;box-shadow:0 6px 24px rgba(0,0,0,.08);overflow:hidden;position:relative}
.stage svg{width:100%;height:100%;display:block}
/* לפני הקריאה: ציור עיפרון אפור וקפוא. אחרי: צבע ותנועה */
.scene{filter:grayscale(1) contrast(1.15) brightness(1.08);transition:filter 1.2s ease}
.alive .scene{filter:none}
.stage:not(.alive) *{animation-play-state:paused !important}
.text{max-width:900px;width:100%;font-size:clamp(28px,4.6vw,48px);line-height:1.9;text-align:center;font-weight:600;min-height:2em;flex-shrink:0}
.text.long{font-size:clamp(24px,3.7vw,40px);line-height:1.75}
.w{display:inline-block;padding:0 .12em;border-radius:12px;transition:color .3s,background .3s;cursor:pointer}
.w.next{background:#fff1c9}
.w.ok{color:var(--ok);background:transparent}
.controls{display:flex;gap:22px;align-items:center}
.mic{width:92px;height:92px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:42px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.mic.on{background:var(--warn);animation:pulse 1.2s infinite}
.mic[disabled]{opacity:.35}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,107,111,.6)}100%{box-shadow:0 0 0 26px rgba(229,107,111,0)}}
.nav{width:66px;height:66px;border-radius:50%;border:none;background:#fff;font-size:32px;box-shadow:0 3px 10px rgba(0,0,0,.12);color:var(--ink)}
.nav[disabled]{opacity:.2}
.nav.glow{background:var(--ok);color:#fff;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-8px) scale(1.08)}}
.status{min-height:1.5em;font-size:19px;opacity:.75;text-align:center}
.book .cover *{animation:none !important}
.book .cover .petal{transform:scale(1)}
.tester-bar{max-width:960px;margin:34px auto 0;text-align:center}
.tester-btn{background:#fff;border:2px dashed #c9b8a6;border-radius:16px;padding:10px 18px;font-size:17px;color:var(--ink)}
.tester-btn.on{background:#3a2e2a;color:#fff;border-style:solid;border-color:#3a2e2a}
.gear{position:fixed;top:14px;left:14px;width:48px;height:48px;border-radius:50%;border:none;background:#fff;font-size:24px;box-shadow:0 3px 10px rgba(0,0,0,.1);z-index:4}
#libTitle{-webkit-touch-callout:none;cursor:default}
.gate{position:fixed;inset:0;background:rgba(58,46,42,.55);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.gate-box{background:#fff;border-radius:24px;padding:26px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.gate-box h2{margin:0 0 6px;font-size:22px}
.slider{position:relative;height:64px;border-radius:32px;background:#f1ebe4;margin:18px 0 10px;touch-action:none;overflow:hidden}
.slider-fill{position:absolute;top:0;right:0;height:100%;width:0;background:#d8e9dc;border-radius:32px}
.slider-target{position:absolute;left:20px;top:0;line-height:64px;font-size:24px;opacity:.55}
.knob{position:absolute;top:4px;right:4px;width:56px;height:56px;border-radius:50%;background:#3a2e2a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 3px 8px rgba(0,0,0,.25);touch-action:none;cursor:grab}
.knob.back,.slider-fill.back{transition:transform .25s ease,width .25s ease}
.hold-bar{height:8px;border-radius:4px;background:#f1ebe4;overflow:hidden}
#holdBar{height:100%;width:0;background:var(--ok)}
.gate-hint{font-size:17px;opacity:.8}
.gate-btns{display:flex;gap:10px;margin-top:10px}
.gate-btns button{flex:1;font-size:18px;padding:12px;border-radius:14px;border:none;font-weight:600}
.gate-ok{background:#3a2e2a;color:#fff}.gate-cancel{background:#f1ebe4;color:var(--ink)}
.tester-badge{position:fixed;bottom:10px;left:10px;background:#3a2e2a;color:#fff;font-size:14px;padding:4px 12px;border-radius:12px;z-index:5}
.test-play{border:none;border-radius:18px;background:#3a2e2a;color:#fff;font-size:18px;padding:12px 18px;font-weight:600}
.confetti{position:absolute;top:-40px;font-size:34px;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}

/* ---- אנימציות הדמויות ---- */
.cat-inner{transform-box:fill-box;transform-origin:center bottom}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.5s infinite}
@keyframes wag{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(20deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.1,.88)}50%{transform:translateY(-70px) scale(.95,1.06)}85%{transform:translateY(0) scale(1.08,.92)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}
@keyframes spin{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-80px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
.alive .p1 .cat-inner{animation:jump .8s ease-in-out .3s 3}
.alive .p2 .cat-inner{animation:hop .5s ease-in-out .8s 4}
.p3 .cat-inner,.end .cat-inner{transform-origin:center}
.alive .p3 .cat-inner{animation:spin 1.3s ease-in-out .3s 2}
.alive .end .cat-inner{animation:jump .8s ease-in-out infinite}

.wing{transform-box:fill-box;animation:flap .22s ease-in-out infinite alternate}
.wl{transform-origin:right center}.wr{transform-origin:left center}
@keyframes flap{to{transform:scaleX(.25)}}
.alive .p2 .butterfly-move{animation:fly 4.5s ease-in-out .2s forwards}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(-70px,-40px)}55%{transform:translate(30px,-110px)}100%{transform:translate(-150px,-240px)}}
.alive .b1 .butterfly-move{animation:loop 3.5s ease-in-out infinite}
@keyframes loop{0%,100%{transform:translate(0,0)}25%{transform:translate(-45px,-25px)}50%{transform:translate(0,-38px)}75%{transform:translate(45px,-25px)}}
.alive .b2 .butterfly-move{animation:land 3s ease-in-out .3s forwards}
@keyframes land{0%{transform:translate(0,0)}40%{transform:translate(-35px,-18px)}70%{transform:translate(-72px,8px)}100%{transform:translate(-93px,27px)}}
.bigflower{transform-box:fill-box;transform-origin:center bottom}
.alive .b2 .bigflower{animation:bloom 1.4s ease-out forwards, sway 2.4s ease-in-out 1.4s infinite}
@keyframes bloom{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

.sun{transform-box:fill-box;transform-origin:center}
.alive .sun{animation:sunspin 8s linear infinite}
@keyframes sunspin{to{transform:rotate(360deg)}}
.star{transform-box:fill-box;transform-origin:center;opacity:0}
.alive .star{animation:pop 1.4s ease-out forwards, twinkle 1.2s ease-in-out 1.4s infinite}
@keyframes pop{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
@keyframes twinkle{50%{transform:scale(.7)}}
.flower{transform-box:fill-box;transform-origin:center bottom;animation:sway 2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
/* ---- עורב, צבי וזאב — גרסה קולנועית ---- */
.deer-inner,.wolf-inner,.raven-inner,.hunter-inner{transform-box:fill-box;transform-origin:center bottom}
.rwing{transform-box:fill-box;transform-origin:center bottom;animation:flapr .28s ease-in-out infinite alternate}
@keyframes flapr{to{transform:scaleY(-.55)}}
.sit .rwing{animation:none}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes stomp{50%{transform:translateY(-14px)}}
@keyframes walkbob{50%{transform:translateY(-7px) rotate(2deg)}}
.legs{transform-box:fill-box;transform-origin:50% 0%}
@keyframes legswing{from{transform:rotate(-10deg)}to{transform:rotate(10deg)}}
/* מלכודת עם לסתות שנפתחות ונסגרות */
.trap-l{transform-box:fill-box;transform-origin:100% 100%}
.trap-r{transform-box:fill-box;transform-origin:0% 100%}
.trap.open .trap-l{transform:rotate(-80deg)}
.trap.open .trap-r{transform:rotate(80deg)}
@keyframes snapL{from{transform:rotate(-80deg)}to{transform:rotate(0)}}
@keyframes snapR{from{transform:rotate(80deg)}to{transform:rotate(0)}}
@keyframes openL{from{transform:rotate(0)}to{transform:rotate(-80deg)}}
@keyframes openR{from{transform:rotate(0)}to{transform:rotate(80deg)}}
@keyframes breakl{to{transform:translate(-50px,-35px) rotate(-80deg);opacity:0}}
@keyframes breakr{to{transform:translate(50px,-35px) rotate(80deg);opacity:0}}
/* סימן קריאה, בועת דיבור */
.bang,.bubble{opacity:0;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bangpop{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* כניסות */
@keyframes enterL{from{transform:translateX(-280px)}to{transform:translateX(0)}}
@keyframes enterR{from{transform:translateX(280px)}to{transform:translateX(0)}}
@keyframes enterT{0%{transform:translate(-140px,-170px)}60%{transform:translate(20px,-30px)}100%{transform:translate(0,0)}}
@keyframes exitL{to{transform:translateX(-320px)}}
@keyframes skydusk{to{fill:#5c6b85}}
@keyframes sundown{to{fill:#f7b267}}
@keyframes grounddusk{to{fill:#7a9a4b}}
.firefly{opacity:0}
@keyframes firefly{0%,100%{opacity:0}50%{opacity:1}}

/* 1 — שלושה מגיעים מכיוונים שונים ונפגשים */
.alive .f1 .enter-l{animation:enterL 2s ease-out forwards}
.alive .f1 .enter-r{animation:enterR 2s ease-out forwards}
.alive .f1 .enter-t{animation:enterT 2.4s ease-in-out forwards}
.alive .f1 .deer-inner,.alive .f1 .wolf-inner{animation:walkbob .3s ease-in-out 7}
.alive .f1 .legs{animation:legswing .3s ease-in-out 7 alternate}
.alive .f1 .raven-inner{animation:bob 1s ease-in-out 2.4s infinite}
.alive .f1 .deer-inner{animation:walkbob .3s ease-in-out 7, hop .5s ease-in-out 2.6s 2}
.alive .f1 .wolf-inner{animation:walkbob .3s ease-in-out 7, hop .5s ease-in-out 2.8s 2}

/* 2 — הזאב צועד, המלכודת נסגרת! */
.alive .f2 .walk{animation:enterWolf 1.7s linear forwards}
@keyframes enterWolf{from{transform:translateX(-150px)}to{transform:translateX(0)}}
.alive .f2 .wolf-inner{animation:walkbob .32s ease-in-out 5, jump .5s ease-in-out 1.75s 3, shake .15s linear 3.3s 8}
.alive .f2 .legs{animation:legswing .32s ease-in-out 5 alternate}
.alive .f2 .trap-l{animation:snapL .12s ease-in 1.7s forwards}
.alive .f2 .trap-r{animation:snapR .12s ease-in 1.7s forwards}
.alive .f2 .bang{animation:bangpop .4s ease-out 1.85s forwards}
.alive .f2 .raven-move{animation:circleR 2.2s ease-in-out 2s infinite}
@keyframes circleR{0%,100%{transform:translate(0,0)}50%{transform:translate(-90px,25px)}}
.alive .f2 .cam{animation:camshake .1s linear 1.7s 5}
@keyframes camshake{25%{transform:translate(-3px,2px)}75%{transform:translate(3px,-2px)}}

/* 3 — העורב מזעיק, הצבי דוהר ושובר */
.alive .f3 .raven-go{animation:ravenGo 1.3s ease-in-out forwards}
@keyframes ravenGo{from{transform:translate(170px,-40px)}to{transform:translate(0,0)}}
.alive .f3 .gallop{animation:enterL 1.3s ease-in 1.2s forwards}
.alive .f3 .deer-inner{animation:hop .32s ease-in-out 1.2s 4, stomp .3s ease-in-out 2.5s 3}
.alive .f3 .trap-l{animation:breakl .9s ease-out 2.9s forwards}
.alive .f3 .trap-r{animation:breakr .9s ease-out 2.9s forwards}
.alive .f3 .wolf-inner{animation:shake .15s linear 1.2s 10, jump .7s ease-in-out 3.2s 2}
.alive .f3 .cam{animation:camshake .1s linear 2.5s 9}

/* 4 — עכשיו הצבי נתפס, השמיים מתקדרים */
.alive .f4 .walk{animation:enterDeer 1.7s linear forwards}
@keyframes enterDeer{from{transform:translateX(150px)}to{transform:translateX(0)}}
.alive .f4 .deer-inner{animation:walkbob .32s ease-in-out 5, jump .5s ease-in-out 1.75s 2, shake .15s linear 2.8s 10}
.alive .f4 .legs{animation:legswing .32s ease-in-out 5 alternate}
.alive .f4 .trap-l{animation:snapL .12s ease-in 1.7s forwards}
.alive .f4 .trap-r{animation:snapR .12s ease-in 1.7s forwards}
.alive .f4 .bang{animation:bangpop .4s ease-out 1.85s forwards}
.alive .f4 .sky{animation:skydusk 2.5s ease 1.7s forwards}
.alive .f4 .raven-move{animation:circleR 2.2s ease-in-out 1.9s 2, flyoff 1.6s ease-in 6.3s forwards}
@keyframes flyoff{to{transform:translate(320px,-60px)}}
.alive .f4 .cam{animation:camshake .1s linear 1.7s 5}

/* 5 — הזאב מתגנב, הציידים צועדים בעקבותיו; המצלמה עוקבת */
.f5 .rclouds{transform:translateX(-320px)}
.alive .f5 .rclouds{animation:cloudsin 2s ease-out forwards}
.alive .f5 .sky{animation:skydusk 2s ease forwards}
.alive .f5 .march{animation:enterR 3.2s linear .3s forwards}
.alive .f5 .sneak{animation:sneak 3.2s linear .3s forwards}
@keyframes sneak{from{transform:translateX(120px)}to{transform:translateX(0)}}
.alive .f5 .wolf-inner{animation:walkbob .4s ease-in-out .3s 8}
.alive .f5 .hunter-inner{animation:stomp .4s ease-in-out .3s 8}
.alive .f5 .legs{animation:legswing .4s ease-in-out .3s 8 alternate}
.alive .f5 .cam{animation:campan 3.5s ease-in-out .3s forwards}
@keyframes campan{0%{transform:translateX(0)}100%{transform:translateX(-18px)}}
.f5 .eyes{transform-box:fill-box;transform-origin:center}
.alive .f5 .wolf-inner .eyes{animation:shifty 1.2s ease-in-out 3.6s 3}
@keyframes shifty{0%,100%{transform:translateX(0)}30%{transform:translateX(-3px)}70%{transform:translateX(3px)}}

/* 6 — העורב לוחש תוכנית ונוחת על הראש */
.alive .f6 .peek{animation:peek 2s ease-out 3s forwards}
@keyframes peek{to{transform:translateX(0)}}
.alive .f6 .raven-move{animation:landhead 2.4s ease-in-out .3s forwards}
@keyframes landhead{0%{transform:translate(0,0)}50%{transform:translate(22px,-8px)}100%{transform:translate(45px,42px)}}
.alive .f6 .bubble{animation:bangpop .4s ease-out 2.7s forwards}
.alive .f6 .deer-inner{animation:breathe 2.2s ease-in-out 2.4s infinite}
@keyframes breathe{50%{transform:scaleY(.97)}}

/* 7 — הציידים פותחים את המלכודת, הצבי מזנק! */
.alive .f7 .march{animation:marchIn 1.5s linear forwards}
@keyframes marchIn{from{transform:translateX(180px)}to{transform:translateX(0)}}
.alive .f7 .hunter-inner{animation:stomp .35s ease-in-out 4, hop .4s ease-in-out 3.2s 3}
.alive .f7 .legs{animation:legswing .35s ease-in-out 4 alternate}
.alive .f7 .trap-l{animation:openL .6s ease-out 1.9s forwards}
.alive .f7 .trap-r{animation:openR .6s ease-out 1.9s forwards}
.alive .f7 .leap{animation:leap 2.4s ease-in-out 2.7s forwards}
@keyframes leap{0%{transform:translate(0,0)}20%{transform:translate(-45px,-65px)}40%{transform:translate(-90px,0)}60%{transform:translate(-140px,-70px)}80%{transform:translate(-190px,0)}100%{transform:translate(-300px,-40px);opacity:0}}
.alive .f7 .bang{animation:bangpop .4s ease-out 3.1s forwards}
.alive .f7 .raven-inner{animation:bob .6s ease-in-out 3s infinite}
.alive .f7 .cam{animation:camzoom 2.4s ease-in-out 2.7s forwards}
@keyframes camzoom{50%{transform:scale(1.08)}100%{transform:scale(1)}}

/* 8 — העורב מוביל, השיח רועד, הזאב נחשף, הרשת נופלת */
.alive .f8 .lead{animation:enterR 2.2s ease-in-out forwards}
.alive .f8 .hunter-inner{animation:stomp .4s ease-in-out 5}
.alive .f8 .legs{animation:legswing .4s ease-in-out 5 alternate}
.bush{transform-box:fill-box;transform-origin:50% 100%}
.alive .f8 .bush{animation:shake .12s linear 2.2s 8, bushaway .6s ease-in 3.2s forwards}
@keyframes bushaway{to{transform:translateY(60px) scale(.3);opacity:0}}
.alive .f8 .wolf-inner{animation:shake .15s linear 2.2s 6, jump .5s ease-in-out 3.3s 1, wiggle .3s ease-in-out 4.8s 8}
.alive .f8 .bang{animation:bangpop .4s ease-out 3.4s forwards}
.net{opacity:0}
.alive .f8 .net{animation:netdrop .9s ease-in 4s forwards}
@keyframes netdrop{0%{opacity:1;transform:translateY(-230px)}100%{opacity:1;transform:translateY(0)}}
.alive .f8 .raven-inner{animation:bob 1s ease-in-out infinite}

/* 9 — שקיעה, גחליליות, חיבוק */
.alive .f9 .sky{animation:sundown 3.5s ease forwards}
.alive .f9 .grass{animation:grounddusk 3.5s ease forwards}
.alive .f9 .sun{animation:sunset 3.5s ease forwards}
@keyframes sunset{to{transform:translateY(60px)}}
.alive .f9 .firefly{animation:firefly 1.8s ease-in-out infinite}
.alive .f9 .deer-inner{animation:hop .7s ease-in-out 3}
.alive .f9 .raven-inner{animation:bob 1s ease-in-out infinite}
.alive .f9 .cam{animation:camin 4s ease-in-out forwards}
@keyframes camin{to{transform:scale(1.08)}}
/* ================= מנוע אנימציה מורחב ================= */
.cam{transform-box:fill-box;transform-origin:50% 40%}
.pt{transform-box:fill-box;transform-origin:center}
@keyframes popin{0%{transform:scale(0)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes fadein{to{opacity:1}}
@keyframes rainfall{to{transform:translateY(270px)}}
@keyframes bubbleup{0%{transform:translate(0,0);opacity:0}10%{opacity:1}100%{transform:translate(var(--dx),-250px);opacity:0}}
@keyframes leaffall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) rotate(340deg)}}
@keyframes puff{0%{transform:translate(0,0) scale(.3);opacity:.95}100%{transform:translate(var(--dx),var(--dy)) scale(2.4);opacity:0}}
@keyframes notes{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(var(--dx),-150px);opacity:0}}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}10%{opacity:1}60%,100%{transform:translate(-240px,100px);opacity:0}}
@keyframes twk{from{opacity:.25}to{opacity:1}}

function sun(x, y) {

function star(x, y, r, delay) {
  let pts = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    pts += `${(x + Math.cos(a) * rr).toFixed(1)},${(y + Math.sin(a) * rr).toFixed(1)} `;
  }
  return `<polygon class="star" style="animation-delay:${delay}s,${delay + 1.4}s" points="${pts}" fill="#ffd166" stroke="#f4a259" stroke-width="1.5"/>`;
}

  a3: () => tone(300, 900, .5, 1.1, 'triangle', .12),
  a4: () => { for (let i = 0; i < 8; i++) tone(700 + i * 60, 900 + i * 60, .12, .7 + i * .13, 'sine', .08); },
  s1: () => { for (let i = 0; i < 4; i++) tone(350, 900, .12, i * .5, 'sine', .1); },
  s3: () => tone(110, 70, 1.5, .3, 'sine', .25),
  f1: () => { for (let i = 0; i < 3; i++) tone(500 + i * 120, 600 + i * 120, .15, 2.5 + i * .15, 'triangle', .1); },
  f2: () => { noise(.12, 1.7, 2500, .5); tone(900, 200, .25, 1.85, 'square', .08); },
  f3: () => { for (let i = 0; i < 4; i++) noise(.08, 1.3 + i * .25, 600, .25); noise(.3, 2.9, 1500, .5); tone(150, 80, .3, 2.9, 'sine', .3); },
  f4: () => { noise(.12, 1.7, 2500, .5); tone(900, 200, .25, 1.85, 'square', .08); },
  f5: () => { for (let i = 0; i < 8; i++) tone(90, 60, .15, .4 + i * .42, 'sine', .3); },
  f6: () => noise(.8, 2.7, 900, .06),
  f7: () => { tone(200, 500, .5, 1.9, 'triangle', .1); for (let i = 0; i < 4; i++) tone(300, 800, .25, 2.7 + i * .5, 'sine', .12); },
  f8: () => { noise(.3, 3.3, 1200, .25); noise(.2, 4.8, 800, .4); tone(120, 60, .3, 4.9, 'sine', .3); },
  f9: () => { [392, 494, 587, 784].forEach((f, i) => tone(f, f, .5, .3 + i * .25, 'triangle', .1)); },
  c1: () => tone(600, 300, .15, 2.4, 'square', .06),
  c2: () => noise(4.5, .2, 280, .35),
  c3: () => { noise(1.6, 0, 300, .2); tone(110, 50, .35, 1.6, 'sine', .4); },
  c4: () => { tone(400, 1100, .3, .4, 'triangle', .12); tone(1100, 500, .3, .75, 'triangle', .1); }
};
function runEffects(scene) {
  const g = stage.querySelector('.fx');
  try { if (g && FX[scene]) FX[scene](g); } catch (_) {}
  try { if (SFX[scene]) SFX[scene](); } catch (_) {}
}

const svgOf = (scene) => `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><g class="scene ${scene}"><g class="cam">${SCENES[scene]()}<g class="fx"></g></g></g></svg>`;

/* =========================================================
   3. השוואת מילים — מסלקת ניקוד ומאפשרת טעויות קטנות
   ========================================================= */
const FINALS = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
const DIGITS = { 1: 'אחת', 2: 'שתיים', 3: 'שלוש', 4: 'ארבע', 5: 'חמש', 6: 'שש', 7: 'שבע', 8: 'שמונה', 9: 'תשע', 10: 'עשר' };
function norm(s) {
  return s.replace(/\d+/g, d => ' ' + (DIGITS[+d] || '') + ' ')   // מספרים שהזיהוי כותב בספרות
          .replace(/[֑-ׇ]/g, '')          // ניקוד וטעמים
          .replace(/[ךםןףץ]/g, c => FINALS[c])       // אותיות סופיות
          .replace(/[^א-ת\s]/g, ' ')        // סימני פיסוק
          .trim().split(/\s+/).filter(Boolean);
}
const loose = w => w.replace(/[וי]/g, '');             // כתיב מלא/חסר
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function similar(heard, target) {
  if (heard === target) return true;
  const a = loose(heard), b = loose(target);
  if (a && a === b) return true;
  const L = Math.max(heard.length, target.length);
  if (L >= 4 && lev(heard, target) <= 1) return true;
  if (L >= 6 && lev(heard, target) <= 2) return true;
  return false;
}
// מיישר את מה שנשמע מול הטקסט, לפי הסדר. מותר לדלג על עד 2 מילים.
function align(heardWords, target) {
  let p = 0; const matched = new Set();
  for (const h of heardWords) {
    for (let k = 0; k < 3 && p + k < target.length; k++) {
      if (similar(h, target[p + k])) { matched.add(p + k); p = p + k + 1; break; }
    }
  }
  return { p, matched };
}
const PASS_RATIO = 0.75; // כמה מהמילים חייבות להיקרא נכון

/* =========================================================
   4. ספרייה — מסך הבחירה
   ========================================================= */
const $ = id => document.getElementById(id);
function finishedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('livebook-finished') || '[]')); } catch (_) { return new Set(); }
}
function markFinished(id) {
  const s = finishedSet(); s.add(id);
  try { localStorage.setItem('livebook-finished', JSON.stringify([...s])); } catch (_) {}
}
// מצב בודק: אפשר לראות את האנימציה בלי לקרוא, ולדפדף חופשי
let tester = false;
try { tester = localStorage.getItem('livebook-tester') === '1'; } catch (_) {}
function setTester(on) {
  tester = on;
  try { localStorage.setItem('livebook-tester', on ? '1' : '0'); } catch (_) {}
  updateTesterUI();
}
function updateTesterUI() {
  $('testerBtn').classList.toggle('hidden', !tester);   // הכפתור מופיע רק כשמצב בודק פעיל — כדי לצאת
  $('testerBadge').classList.toggle('hidden', !tester);
}
// כניסה: לוחצים על ⚙️, גוררים את הכפתור עד הסוף ומחזיקים 2 שניות
const HOLD_MS = 2000;
let drag = null, holding = false, holdStart = 0, holdRaf = 0;
function setKnob(dx, animate) {
  $('knob').classList.toggle('back', !!animate); $('sliderFill').classList.toggle('back', !!animate);
  $('knob').style.transform = `translateX(${-dx}px)`;          // גוררים מימין לשמאל
  $('sliderFill').style.width = dx ? (dx + 60) + 'px' : '0';
}
function openGate() {
  drag = null; cancelHold(); setKnob(0, false);
  $('gateHint').textContent = 'גררו את הכפתור עד הסוף והחזיקו 2 שניות';
  $('gate').classList.remove('hidden');
}
function closeGate() { drag = null; cancelHold(); $('gate').classList.add('hidden'); }
function startHold() {
  if (holding) return;
  holding = true; holdStart = performance.now();
  $('gateHint').textContent = 'ממשיכים להחזיק...';
  const step = now => {
    if (!holding) return;
    const p = Math.min(1, (now - holdStart) / HOLD_MS);
    $('holdBar').style.width = (p * 100) + '%';
    if (p >= 1) { closeGate(); setTester(true); return; }
    holdRaf = requestAnimationFrame(step);
  };
  holdRaf = requestAnimationFrame(step);
}
function cancelHold() {
  holding = false; cancelAnimationFrame(holdRaf);
  $('holdBar').style.width = '0';
}
const knob = $('knob');
knob.addEventListener('pointerdown', e => {
  e.preventDefault();
  const max = $('slider').clientWidth - 64;
  drag = { x0: e.clientX, max };
  try { knob.setPointerCapture(e.pointerId); } catch (_) {}
  setKnob(0, false);
});
knob.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = Math.max(0, Math.min(drag.max, drag.x0 - e.clientX));
  setKnob(dx, false);
  if (dx >= drag.max - 3) startHold();
  else if (holding) { cancelHold(); $('gateHint').textContent = 'גררו את הכפתור עד הסוף והחזיקו 2 שניות'; }
});
const release = () => {
  if (!drag) return;
  drag = null;
  if (holding) { cancelHold(); $('gateHint').textContent = 'עזבתם מוקדם מדי — נסו שוב'; }
  setKnob(0, true);
};
knob.addEventListener('pointerup', release);
knob.addEventListener('pointercancel', release);
function showLibrary() {
  stopListening();
  updateTesterUI();
  const fin = finishedSet();
  $('shelf').innerHTML = '';
  BOOKS.forEach(b => {
    const card = document.createElement('button');
    card.className = 'book';
    card.innerHTML = `<span class="cover alive">${svgOf(b.cover)}</span>
      <span class="name">${b.title}</span>
      <span class="meta">${b.pages.length} דפים</span>
      ${fin.has(b.id) ? '<span class="done">⭐ קראתי</span>' : ''}`;
    card.onclick = () => openBook(b);
    $('shelf').appendChild(card);
  });
  $('reader').classList.add('hidden');
  $('library').classList.remove('hidden');
}
function openBook(b) {
  book = b;
  pages = [...b.pages, { text: END_TEXT, scene: b.endScene || 'end', end: true }];
  page = 0;
  $('title').textContent = b.title;
  $('library').classList.add('hidden');
  $('reader').classList.remove('hidden');
  autoListen = false;
  render();
}

/* =========================================================
   5. זיהוי קולי
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, finalText = '', done = false;
let book = null, pages = [], page = 0, target = [], spans = [];

const stage = $('stage'), textEl = $('text'), micBtn = $('mic'), statusEl = $('status');

function setStatus(t) { statusEl.textContent = t; }
function updateMic() {
  micBtn.classList.toggle('on', listening);
  micBtn.textContent = listening ? '👂' : '🎤';
}

function startListening() {
  if (!SR || done) return;
  if (!rec) {
    rec = new SR();
    rec.lang = 'he-IL';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += ' ' + r[0].transcript;
        else interim += ' ' + r[0].transcript;
      }
      check(finalText + ' ' + interim);
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        listening = false; updateMic();
        setStatus('צריך לאשר גישה למיקרופון בהגדרות של ספארי');
      }
    };
    rec.onend = () => {             // באייפד ההקשבה נעצרת לבד מדי פעם — מפעילים מחדש
      if (listening && !done) setTimeout(() => { try { rec.start(); } catch (_) {} }, 200);
      else updateMic();
    };
  }
  try { rec.start(); } catch (_) {}
  listening = true; updateMic();
  setStatus('אני מקשיב... קראו בקול 📖');
}
function stopListening() {
  listening = false; updateMic();
  try { rec && rec.stop(); } catch (_) {}
}

function check(heard) {
  if (done) return;
  const { p, matched } = align(norm(heard), target);
  spans.forEach((s, i) => {
    s.classList.toggle('ok', matched.has(i));
    s.classList.toggle('next', i === p);
  });
  if (p === target.length && matched.size >= Math.ceil(target.length * PASS_RATIO)) success();
}

/* =========================================================
   6. הצלחה — הציור מתעורר
   ========================================================= */
function success() {
  if (done) return;
  done = true;
  stopListening();
  spans.forEach(s => { s.classList.add('ok'); s.classList.remove('next'); });
  stage.classList.add('alive');
  runEffects(pages[page].scene);
  setStatus('כל הכבוד! 🎉');
  chime(); confetti();
  micBtn.disabled = true;
  const nx = $('next');
  nx.disabled = false;
  nx.classList.add('glow');
  $('testPlay').textContent = '↺ שוב';
}
function chime() {
  try {
    const ctx = audio(); if (!ctx) return;
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = 'triangle';
      g.gain.setValueAtTime(.0001, ctx.currentTime + i * .12);
      g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + i * .12 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + i * .12 + .4);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + i * .12); o.stop(ctx.currentTime + i * .12 + .45);
    });
  } catch (_) {}
}
function confetti() {
  const items = ['⭐', '🌟', '✨', '🎈', '💛'];
  for (let i = 0; i < 18; i++) {
    const d = document.createElement('div');
    d.className = 'confetti';
    d.textContent = items[i % items.length];
    d.style.left = Math.random() * 95 + '%';
    d.style.animationDelay = Math.random() * .8 + 's';
    stage.appendChild(d);
    setTimeout(() => d.remove(), 3500);
  }
}

/* =========================================================
   7. החלפת דפים
   ========================================================= */
function render() {
  const pg = pages[page];
  done = false; finalText = '';
  stage.classList.remove('alive');
  stage.innerHTML = svgOf(pg.scene);
  textEl.innerHTML = '';
  spans = []; target = [];
  textEl.classList.toggle('long', pg.text.length > 45);
  $('pageNum').textContent = pg.end ? '⭐' : `${page + 1} / ${pages.length - 1}`;
  $('prev').disabled = page === 0;
  const nx = $('next'); nx.disabled = !tester; nx.classList.remove('glow');
  $('testPlay').classList.toggle('hidden', !tester || !!pg.end);
  $('testPlay').textContent = '▶ הצג אנימציה';

  if (pg.end) {                       // דף הסיום מתעורר לבד
    textEl.textContent = pg.text;
    micBtn.disabled = true;
    stage.classList.add('alive');
    setStatus('');
    markFinished(book.id);
    setTimeout(() => { chime(); confetti(); runEffects(pg.scene); }, 300);
    nx.disabled = false; nx.textContent = '↺'; nx.setAttribute('aria-label', 'לקרוא שוב');
    return;
  }
  pg.text.split(/\s+/).filter(t => norm(t).length).forEach((t, i) => {
    const s = document.createElement('span');
    s.className = 'w' + (i === 0 ? ' next' : '');
    s.textContent = t;
    s.onclick = () => sayWord(t);
    textEl.appendChild(s); textEl.append(' ');
    spans.push(s); target.push(norm(t)[0] || '');
  });
  micBtn.disabled = false;
  nx.textContent = '←'; nx.setAttribute('aria-label', 'הדף הבא');
  setStatus(SR ? 'לחצו על המיקרופון והתחילו לקרוא' : 'הדפדפן הזה לא תומך בזיהוי קולי. פתחו בספארי באייפד.');
}

// לחיצה על מילה — האייפד מקריא אותה (עוזר לילד שנתקע)
function sayWord(w) {
  if (!('speechSynthesis' in window)) return;
  const wasListening = listening;
  if (wasListening) stopListening();     // שהמיקרופון לא "ישמע" את ההקראה
  const u = new SpeechSynthesisUtterance(w);
  u.lang = 'he-IL'; u.rate = .8;
  u.onend = () => { if (wasListening && !done) startListening(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

let autoListen = false;   // ברגע שהילד הדליק את המיקרופון פעם אחת, ההקשבה ממשיכה לבד בכל דף
micBtn.onclick = () => {
  if (listening) { autoListen = false; stopListening(); }
  else { autoListen = true; startListening(); }
};
function resumeListening() {
  if (autoListen && !pages[page].end && !done) startListening();
}
$('next').onclick = () => {
  stopListening();
  if (pages[page].end) page = 0; else page++;
  render();
  resumeListening();
};
$('prev').onclick = () => { stopListening(); if (page > 0) { page--; render(); resumeListening(); } };
$('testPlay').onclick = () => {
  if (pages[page].end) return;
  if (done) { render(); setTimeout(success, 400); }   // להריץ שוב את האנימציה
  else success();
};
$('testerBtn').onclick = () => setTester(false);
$('gear').onclick = () => tester ? setTester(false) : openGate();
$('gateCancel').onclick = closeGate;
$('home').onclick = showLibrary;

showLibrary();
</script>
</body>
</html>
