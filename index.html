<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ספר חי</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ec;--ink:#3a2e2a;--ok:#2a9d5c;--accent:#f4a259;--warn:#e56b6f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:var(--bg);font-family:Rubik,Arial,sans-serif;color:var(--ink);overflow:hidden}
button{font-family:inherit;cursor:pointer}
.hidden{display:none !important}

/* ---- מסך הספרייה ---- */
#library{height:100%;overflow-y:auto;padding:28px 20px 40px}
#library h1{text-align:center;font-size:clamp(34px,6vw,56px);margin:0 0 6px;font-weight:800}
#library .sub{text-align:center;font-size:20px;opacity:.65;margin-bottom:28px}
.shelf{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:24px}
.book{background:#fff;border:none;border-radius:24px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.09);padding:0;text-align:center;color:var(--ink);transition:transform .2s;position:relative}
.book:active{transform:scale(.96)}
.book .cover{aspect-ratio:4/3;display:block;width:100%}
.book .cover svg{width:100%;height:100%;display:block}
.book .name{display:block;font-size:26px;font-weight:800;padding:14px 10px 4px}
.book .meta{display:block;font-size:16px;opacity:.6;padding-bottom:16px}
.book .done{position:absolute;top:10px;left:10px;background:#fff;border-radius:20px;padding:4px 10px;font-size:16px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.12)}

/* ---- מסך הקריאה ---- */
#reader{height:100%;display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px}
.top{width:100%;max-width:900px;display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:600;gap:12px}
.home{width:52px;height:52px;border-radius:50%;border:none;background:#fff;font-size:26px;box-shadow:0 3px 10px rgba(0,0,0,.1)}
#title{flex:1;text-align:center}
.stage{width:100%;max-width:900px;flex:1 1 auto;min-height:0;background:#fff;border-radius:28px;box-shadow:0 6px 24px rgba(0,0,0,.08);overflow:hidden;position:relative}
.stage svg{width:100%;height:100%;display:block}
/* לפני הקריאה: ציור עיפרון אפור וקפוא. אחרי: צבע ותנועה */
.scene{filter:grayscale(1) contrast(1.15) brightness(1.08);transition:filter 1.2s ease}
.alive .scene{filter:none}
.stage:not(.alive) *{animation-play-state:paused !important}
.text{max-width:900px;width:100%;font-size:clamp(28px,4.6vw,48px);line-height:1.9;text-align:center;font-weight:600;min-height:2em;flex-shrink:0}
.text.long{font-size:clamp(24px,3.7vw,40px);line-height:1.75}
.w{display:inline-block;padding:0 .12em;border-radius:12px;transition:color .3s,background .3s;cursor:pointer}
.w.next{background:#fff1c9}
.w.ok{color:var(--ok);background:transparent}
.controls{display:flex;gap:22px;align-items:center}
.mic{width:92px;height:92px;border-radius:50%;border:none;background:var(--accent);color:#fff;font-size:42px;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.mic.on{background:var(--warn);animation:pulse 1.2s infinite}
.mic[disabled]{opacity:.35}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,107,111,.6)}100%{box-shadow:0 0 0 26px rgba(229,107,111,0)}}
.nav{width:66px;height:66px;border-radius:50%;border:none;background:#fff;font-size:32px;box-shadow:0 3px 10px rgba(0,0,0,.12);color:var(--ink)}
.nav[disabled]{opacity:.2}
.nav.glow{background:var(--ok);color:#fff;animation:nudge 1s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(-8px) scale(1.08)}}
.status{min-height:1.5em;font-size:19px;opacity:.75;text-align:center}
.skip{position:fixed;bottom:8px;left:10px;background:none;border:none;opacity:.25;font-size:14px;color:var(--ink)}
.confetti{position:absolute;top:-40px;font-size:34px;pointer-events:none;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(120vh) rotate(540deg)}}

/* ---- אנימציות הדמויות ---- */
.cat-inner{transform-box:fill-box;transform-origin:center bottom}
.tail{transform-box:fill-box;transform-origin:0% 100%;animation:wag 1.6s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.5s infinite}
@keyframes wag{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(20deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.1,.88)}50%{transform:translateY(-70px) scale(.95,1.06)}85%{transform:translateY(0) scale(1.08,.92)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}
@keyframes spin{0%{transform:translateY(0) rotate(0)}50%{transform:translateY(-80px) rotate(180deg)}100%{transform:translateY(0) rotate(360deg)}}
.alive .p1 .cat-inner{animation:jump .8s ease-in-out .3s 3}
.alive .p2 .cat-inner{animation:hop .5s ease-in-out .8s 4}
.p3 .cat-inner,.end .cat-inner{transform-origin:center}
.alive .p3 .cat-inner{animation:spin 1.3s ease-in-out .3s 2}
.alive .end .cat-inner{animation:jump .8s ease-in-out infinite}

.wing{transform-box:fill-box;animation:flap .22s ease-in-out infinite alternate}
.wl{transform-origin:right center}.wr{transform-origin:left center}
@keyframes flap{to{transform:scaleX(.25)}}
.alive .p2 .butterfly-move{animation:fly 4.5s ease-in-out .2s forwards}
@keyframes fly{0%{transform:translate(0,0)}25%{transform:translate(-70px,-40px)}55%{transform:translate(30px,-110px)}100%{transform:translate(-150px,-240px)}}
.alive .b1 .butterfly-move{animation:loop 3.5s ease-in-out infinite}
@keyframes loop{0%,100%{transform:translate(0,0)}25%{transform:translate(-45px,-25px)}50%{transform:translate(0,-38px)}75%{transform:translate(45px,-25px)}}
.alive .b2 .butterfly-move{animation:land 3s ease-in-out .3s forwards}
@keyframes land{0%{transform:translate(0,0)}40%{transform:translate(-35px,-18px)}70%{transform:translate(-72px,8px)}100%{transform:translate(-93px,27px)}}
.bigflower{transform-box:fill-box;transform-origin:center bottom}
.alive .b2 .bigflower{animation:bloom 1.4s ease-out forwards, sway 2.4s ease-in-out 1.4s infinite}
@keyframes bloom{0%{transform:scale(.4)}70%{transform:scale(1.12)}100%{transform:scale(1)}}

.sun{transform-box:fill-box;transform-origin:center}
.alive .sun{animation:sunspin 8s linear infinite}
@keyframes sunspin{to{transform:rotate(360deg)}}
.star{transform-box:fill-box;transform-origin:center;opacity:0}
.alive .star{animation:pop 1.4s ease-out forwards, twinkle 1.2s ease-in-out 1.4s infinite}
@keyframes pop{0%{opacity:0;transform:scale(0)}60%{opacity:1;transform:scale(1.4)}100%{opacity:1;transform:scale(1)}}
@keyframes twinkle{50%{transform:scale(.7)}}
.flower{transform-box:fill-box;transform-origin:center bottom;animation:sway 2s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
/* ---- עורב, צבי וזאב ---- */
.deer-inner,.wolf-inner,.raven-inner,.hunter-inner{transform-box:fill-box;transform-origin:center bottom}
.rwing{transform-box:fill-box;transform-origin:center bottom;animation:flapr .28s ease-in-out infinite alternate}
@keyframes flapr{to{transform:scaleY(-.55)}}
.sit .rwing{animation:none}
@keyframes bob{50%{transform:translateY(-12px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes stomp{50%{transform:translateY(-14px)}}
.trap-l,.trap-r{transform-box:fill-box;transform-origin:center}
.alive .f1 .raven-inner{animation:bob 1s ease-in-out infinite}
.alive .f1 .deer-inner{animation:hop .6s ease-in-out .2s 3}
.alive .f1 .wolf-inner{animation:hop .6s ease-in-out .5s 3}
.alive .f2 .wolf-inner{animation:wiggle .3s ease-in-out 10}
.alive .f2 .raven-move{animation:circleR 3s ease-in-out infinite}
@keyframes circleR{0%,100%{transform:translate(0,0)}50%{transform:translate(-70px,18px)}}
.alive .f3 .trap-l{animation:breakl 1s ease-out .3s forwards}
.alive .f3 .trap-r{animation:breakr 1s ease-out .3s forwards}
@keyframes breakl{to{transform:translate(-50px,-35px) rotate(-80deg);opacity:0}}
@keyframes breakr{to{transform:translate(50px,-35px) rotate(80deg);opacity:0}}
.alive .f3 .wolf-inner{animation:jump .8s ease-in-out 1s 2}
.alive .f3 .deer-inner{animation:stomp .35s ease-in-out 3}
.alive .f4 .deer-inner{animation:wiggle .3s ease-in-out 10}
.alive .f4 .raven-move{animation:flyoff 3s ease-in .5s forwards}
@keyframes flyoff{to{transform:translate(300px,-30px)}}
.alive .f5 .run{animation:runleft 3.5s ease-in-out forwards}
@keyframes runleft{to{transform:translateX(-70px)}}
.alive .f5 .wolf-inner,.alive .f5 .hunter-inner{animation:stomp .35s ease-in-out 10}
.alive .f6 .raven-move{animation:landhead 2.5s ease-in-out .3s forwards}
@keyframes landhead{0%{transform:translate(0,0)}50%{transform:translate(22px,-8px)}100%{transform:translate(45px,42px)}}
.alive .f7 .leap{animation:leap 2.6s ease-in-out .3s forwards}
@keyframes leap{0%{transform:translate(0,0)}20%{transform:translate(-45px,-55px)}40%{transform:translate(-90px,0)}60%{transform:translate(-135px,-55px)}80%{transform:translate(-180px,0)}100%{transform:translate(-280px,-30px);opacity:0}}
.alive .f7 .hunter-inner{animation:stomp .35s ease-in-out 1s 4}
.alive .f7 .raven-inner,.alive .f8 .raven-inner,.alive .f9 .raven-inner{animation:bob 1s ease-in-out infinite}
.net{opacity:0}
.alive .f8 .net{animation:netdrop 1.1s ease-in .4s forwards}
@keyframes netdrop{0%{opacity:1;transform:translateY(-230px)}100%{opacity:1;transform:translateY(0)}}
.alive .f8 .wolf-inner{animation:wiggle .3s ease-in-out 1.6s 8}
.alive .f9 .deer-inner{animation:hop .7s ease-in-out infinite}
</style>
</head>
<body>

<!-- מסך הספרייה -->
<div id="library">
  <h1>📚 הספרייה שלי</h1>
  <div class="sub">בחרו ספר וקראו בקול — הציורים מתעוררים לחיים!</div>
  <div class="shelf" id="shelf"></div>
</div>

<!-- מסך הקריאה -->
<div id="reader" class="hidden">
  <div class="top">
    <button class="home" id="home" aria-label="חזרה לספרייה">🏠</button>
    <span id="title"></span>
    <span id="pageNum"></span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="text" id="text"></div>
  <div class="status" id="status"></div>
  <div class="controls">
    <button class="nav" id="prev" aria-label="הדף הקודם">→</button>
    <button class="mic" id="mic" aria-label="להתחיל להקשיב">🎤</button>
    <button class="nav" id="next" aria-label="הדף הבא">←</button>
  </div>
  <button class="skip" id="skip">דילוג (להורים)</button>
</div>

<script>
/* =========================================================
   1. הספרים — כדי להוסיף סיפור, מעתיקים בלוק { ... } ומשנים
      title  = שם הספר
      cover  = איזה ציור יופיע על הכריכה
      pages  = הדפים: text (עם ניקוד) + scene (שם הציור)
      endScene = (לא חובה) הציור של דף הסיום
      דף "כל הכבוד" בסוף נוסף אוטומטית.
   ========================================================= */
const BOOKS = [
  {
    id: 'mitzi',
    title: 'מִיצִי וְהַפַּרְפַּר',
    cover: 'p1',
    pages: [
      { text: 'זֹאת מִיצִי. מִיצִי הִיא חֲתוּלָה קְטַנָּה.', scene: 'p1' },
      { text: 'מִיצִי רוֹאָה פַּרְפַּר. הַפַּרְפַּר עָף גָּבוֹהַּ.', scene: 'p2' },
      { text: 'מִיצִי קוֹפֶצֶת וְצוֹחֶקֶת. אֵיזֶה יוֹם יָפֶה!', scene: 'p3' }
    ]
  },
  {
    id: 'purple-butterfly',
    title: 'הַפַּרְפַּר הַסָּגֹל',
    cover: 'b1',
    pages: [
      { text: 'יֵשׁ פַּרְפַּר סָגֹל בַּגִּנָּה.', scene: 'b1' },
      { text: 'הַפַּרְפַּר נָח עַל פֶּרַח אָדֹם.', scene: 'b2' }
    ]
  },
  {
    id: 'raven-deer-wolf',
    title: 'עוֹרֵב, צְבִי וּזְאֵב',
    cover: 'f1',
    endScene: 'f9',
    pages: [
      { text: 'עוֹרֵב, צְבִי וּזְאֵב נִפְגְּשׁוּ בַּיַּעַר. הֵם הֶחְלִיטוּ לִהְיוֹת כְּמוֹ אַחִים.', scene: 'f1' },
      { text: 'יוֹם אֶחָד נָפַל הַזְּאֵב לְמַלְכֹּדֶת.', scene: 'f2' },
      { text: 'הָעוֹרֵב קָרָא לַצְּבִי. הַצְּבִי שָׁבַר אֶת הַמַּלְכֹּדֶת.', scene: 'f3' },
      { text: 'אַחַר כָּךְ נָפַל הַצְּבִי לְמַלְכֹּדֶת.', scene: 'f4' },
      { text: 'אֲבָל הַזְּאֵב לֹא עָזַר. הוּא הֵבִיא אֶת הַצַּיָּדִים.', scene: 'f5' },
      { text: 'הָעוֹרֵב אָמַר: שְׁכַב וְאַל תָּזוּז. אֲנִי אֵשֵׁב עַל רֹאשְׁךָ.', scene: 'f6' },
      { text: 'הַצַּיָּדִים פָּתְחוּ אֶת הַמַּלְכֹּדֶת, וְהַצְּבִי בָּרַח!', scene: 'f7' },
      { text: 'הָעוֹרֵב הוֹבִיל אֶת הַצַּיָּדִים אֶל הַזְּאֵב, וְהֵם תָּפְסוּ אוֹתוֹ.', scene: 'f8' },
      { text: 'חָבֵר אֲמִתִּי עוֹזֵר גַּם בְּשָׁעָה קָשָׁה.', scene: 'f9' }
    ]
  }
];
const END_TEXT = 'כָּל הַכָּבוֹד! סִיַּמְתָּ אֶת הַסֵּפֶר!';

/* =========================================================
   2. ציורים (SVG)
   ========================================================= */
function cat(x, y, s = 1) {
  return `<g transform="translate(${x},${y}) scale(${s})"><g class="cat-inner">
    <path class="tail" d="M40 30 Q95 10 82 -45" stroke="#f4a259" stroke-width="13" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="22" rx="50" ry="38" fill="#f4a259"/>
    <ellipse cx="0" cy="32" rx="28" ry="22" fill="#ffe1c2"/>
    <ellipse cx="-24" cy="58" rx="13" ry="8" fill="#e8913f"/>
    <ellipse cx="24" cy="58" rx="13" ry="8" fill="#e8913f"/>
    <polygon points="-38,-52 -32,-96 -6,-64" fill="#f4a259"/>
    <polygon points="38,-52 32,-96 6,-64" fill="#f4a259"/>
    <polygon points="-30,-60 -28,-84 -14,-66" fill="#ffb4a2"/>
    <polygon points="30,-60 28,-84 14,-66" fill="#ffb4a2"/>
    <circle cx="0" cy="-42" r="40" fill="#f4a259"/>
    <g class="eyes"><ellipse cx="-15" cy="-48" rx="6" ry="8" fill="#333"/><ellipse cx="15" cy="-48" rx="6" ry="8" fill="#333"/>
      <circle cx="-13" cy="-51" r="2" fill="#fff"/><circle cx="17" cy="-51" r="2" fill="#fff"/></g>
    <circle cx="-26" cy="-32" r="6" fill="#ffb4a2" opacity=".7"/><circle cx="26" cy="-32" r="6" fill="#ffb4a2" opacity=".7"/>
    <polygon points="-5,-35 5,-35 0,-29" fill="#e56b6f"/>
    <path d="M-9 -25 Q-4 -19 0 -26 Q4 -19 9 -25" stroke="#333" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    <g stroke="#333" stroke-width="1.6" stroke-linecap="round"><line x1="-18" y1="-30" x2="-44" y2="-34"/><line x1="-18" y1="-26" x2="-44" y2="-22"/>
      <line x1="18" y1="-30" x2="44" y2="-34"/><line x1="18" y1="-26" x2="44" y2="-22"/></g>
  </g></g>`;
}
function sun(x, y) {
  let rays = '';
  for (let i = 0; i < 8; i++) {
    const a = i * Math.PI / 4;
    rays += `<line x1="${x + Math.cos(a) * 36}" y1="${y + Math.sin(a) * 36}" x2="${x + Math.cos(a) * 50}" y2="${y + Math.sin(a) * 50}" stroke="#ffb703" stroke-width="5" stroke-linecap="round"/>`;
  }
  return `<g class="sun">${rays}<circle cx="${x}" cy="${y}" r="28" fill="#ffd166"/></g>`;
}
function flower(x, y, c) {
  return `<g class="flower"><line x1="${x}" y1="${y}" x2="${x}" y2="${y - 26}" stroke="#2d6a4f" stroke-width="3"/>
    <circle cx="${x}" cy="${y - 30}" r="8" fill="${c}"/><circle cx="${x}" cy="${y - 30}" r="3" fill="#ffd166"/></g>`;
}
function bigFlower(x, y, c) {
  const top = y - 110;
  let petals = '';
  for (let i = 0; i < 6; i++) {
    const a = i * Math.PI / 3;
    petals += `<circle cx="${x + Math.cos(a) * 24}" cy="${top + Math.sin(a) * 24}" r="18" fill="${c}"/>`;
  }
  return `<g class="bigflower">
    <path d="M${x} ${y} Q${x - 10} ${y - 55} ${x} ${top}" stroke="#2d6a4f" stroke-width="6" fill="none"/>
    <ellipse cx="${x - 20}" cy="${y - 45}" rx="18" ry="8" fill="#52b788" transform="rotate(-30 ${x - 20} ${y - 45})"/>
    <ellipse cx="${x + 18}" cy="${y - 65}" rx="18" ry="8" fill="#52b788" transform="rotate(30 ${x + 18} ${y - 65})"/>
    ${petals}<circle cx="${x}" cy="${top}" r="16" fill="#ffd166"/></g>`;
}
function star(x, y, r, delay) {
  let pts = '';
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r;
    pts += `${(x + Math.cos(a) * rr).toFixed(1)},${(y + Math.sin(a) * rr).toFixed(1)} `;
  }
  return `<polygon class="star" style="animation-delay:${delay}s,${delay + 1.4}s" points="${pts}" fill="#ffd166" stroke="#f4a259" stroke-width="1.5"/>`;
}
function butterfly(x, y, s = 1) {
  return `<g transform="translate(${x},${y}) scale(${s})"><g class="butterfly-move">
    <g class="wing wl"><ellipse cx="-11" cy="-4" rx="12" ry="16" fill="#cdb4db"/><ellipse cx="-9" cy="10" rx="7" ry="8" fill="#b8a1cc"/></g>
    <g class="wing wr"><ellipse cx="11" cy="-4" rx="12" ry="16" fill="#9d7fc4"/><ellipse cx="9" cy="10" rx="7" ry="8" fill="#b8a1cc"/></g>
    <rect x="-2.5" y="-14" width="5" height="26" rx="2.5" fill="#5a4a42"/>
  </g></g>`;
}
function ground() {
  return `<rect width="400" height="300" fill="#bde0fe"/>
    <ellipse cx="300" cy="55" rx="40" ry="14" fill="#fff" opacity=".9"/><ellipse cx="325" cy="48" rx="26" ry="12" fill="#fff" opacity=".9"/>
    <rect y="235" width="400" height="65" fill="#95d5b2"/>
    ${flower(40, 270, '#ff8fab')}${flower(340, 275, '#a2d2ff')}${flower(370, 262, '#ffc8dd')}`;
}

/* ---- דמויות: עורב, צבי, זאב, צייד ---- */
// f = 1 פונה ימינה, f = -1 פונה שמאלה. הרגליים בגובה y+60
function deer(x, y, s = 1, f = 1, lying = false) {
  const dy = lying ? 28 : 0;
  const legs = lying
    ? `<ellipse cx="-25" cy="26" rx="16" ry="7" fill="#a8612b"/><ellipse cx="25" cy="26" rx="16" ry="7" fill="#a8612b"/>`
    : `<g fill="#a8612b"><rect x="-38" y="10" width="8" height="50" rx="3"/><rect x="-24" y="10" width="8" height="50" rx="3"/>
       <rect x="18" y="10" width="8" height="50" rx="3"/><rect x="31" y="10" width="8" height="50" rx="3"/></g>`;
  const eye = lying
    ? `<path d="M56 -59 Q60 -56 64 -59" stroke="#333" stroke-width="2.5" fill="none" stroke-linecap="round"/>`
    : `<g class="eyes"><circle cx="60" cy="-60" r="4" fill="#333"/><circle cx="61.5" cy="-61.5" r="1.3" fill="#fff"/></g>`;
  return `<g transform="translate(${x},${y + dy}) scale(${s * f},${s})"><g class="deer-inner">
    ${legs}
    <ellipse cx="-50" cy="-8" rx="8" ry="6" fill="#fff"/>
    <ellipse cx="0" cy="4" rx="52" ry="27" fill="#c97b3d"/>
    <g fill="#f3d5b5"><circle cx="-18" cy="-4" r="4"/><circle cx="2" cy="-10" r="4"/><circle cx="20" cy="-2" r="4"/></g>
    <polygon points="28,-4 44,-52 62,-46 50,4" fill="#c97b3d"/>
    <g stroke="#7a4a24" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M54 -66 L48 -96 M50 -84 L38 -94 M49 -76 L58 -90"/><path d="M64 -66 L68 -94 M67 -84 L78 -92"/></g>
    <ellipse cx="44" cy="-64" rx="11" ry="5" fill="#a8612b" transform="rotate(-30 44 -64)"/>
    <ellipse cx="60" cy="-55" rx="20" ry="14" fill="#c97b3d"/>
    <ellipse cx="76" cy="-50" rx="9" ry="7" fill="#b56a32"/><circle cx="83" cy="-51" r="3" fill="#333"/>
    ${eye}
  </g></g>`;
}
function wolf(x, y, s = 1, f = 1) {
  return `<g transform="translate(${x},${y}) scale(${s * f},${s})"><g class="wolf-inner">
    <path d="M-44 -6 Q-84 -14 -80 26 Q-64 10 -44 10Z" fill="#6c757d"/>
    <g fill="#6c757d"><rect x="-34" y="8" width="9" height="52" rx="3"/><rect x="-20" y="8" width="9" height="52" rx="3"/>
      <rect x="16" y="8" width="9" height="52" rx="3"/><rect x="29" y="8" width="9" height="52" rx="3"/></g>
    <ellipse cx="0" cy="0" rx="50" ry="25" fill="#8d99ae"/>
    <ellipse cx="6" cy="12" rx="30" ry="11" fill="#d6dbe0"/>
    <polygon points="34,-40 38,-68 52,-44" fill="#6c757d"/><polygon points="50,-44 60,-68 66,-40" fill="#6c757d"/>
    <circle cx="50" cy="-26" r="23" fill="#8d99ae"/>
    <polygon points="62,-32 94,-21 62,-11" fill="#8d99ae"/><polygon points="66,-18 92,-20 66,-12" fill="#d6dbe0"/>
    <circle cx="92" cy="-22" r="4.5" fill="#222"/>
    <g class="eyes"><ellipse cx="56" cy="-32" rx="3.5" ry="4" fill="#222"/></g>
    <path d="M44 -42 L60 -36" stroke="#4a4f55" stroke-width="2.5" stroke-linecap="round"/>
  </g></g>`;
}
// העורב: מרכז הגוף ב-(x,y). sit = יושב בלי לנפנף
function raven(x, y, s = 1, f = 1, sit = false) {
  return `<g transform="translate(${x},${y}) scale(${s * f},${s})" class="${sit ? 'sit' : ''}"><g class="raven-move"><g class="raven-inner">
    <polygon points="-18,-2 -40,-9 -40,9" fill="#222"/>
    <line x1="-4" y1="12" x2="-6" y2="22" stroke="#555" stroke-width="2.5"/><line x1="6" y1="12" x2="6" y2="22" stroke="#555" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="23" ry="14" fill="#222"/>
    <circle cx="20" cy="-9" r="11" fill="#222"/>
    <polygon points="28,-12 42,-7 28,-3" fill="#6c6c6c"/>
    <circle cx="23" cy="-12" r="2.3" fill="#fff"/>
    <g class="rwing"><path d="M-8 -6 Q0 -42 22 -34 Q12 -18 8 -4Z" fill="#3a3a3a"/></g>
  </g></g></g>`;
}
function hunter(x, y, s = 1, f = 1) {
  return `<g transform="translate(${x},${y}) scale(${s * f},${s})"><g class="hunter-inner">
    <rect x="-11" y="18" width="9" height="42" rx="3" fill="#5c4033"/><rect x="3" y="18" width="9" height="42" rx="3" fill="#5c4033"/>
    <rect x="-18" y="-26" width="36" height="50" rx="8" fill="#4f772d"/>
    <rect x="-27" y="-20" width="10" height="34" rx="5" fill="#4f772d"/><rect x="17" y="-20" width="10" height="34" rx="5" fill="#4f772d"/>
    <circle cx="0" cy="-42" r="15" fill="#f1c27d"/>
    <circle cx="-5" cy="-43" r="2" fill="#333"/><circle cx="5" cy="-43" r="2" fill="#333"/>
    <path d="M-5 -36 Q0 -33 5 -36" stroke="#333" stroke-width="1.8" fill="none"/>
    <ellipse cx="0" cy="-56" rx="13" ry="8" fill="#386641"/><rect x="-20" y="-55" width="40" height="6" rx="3" fill="#386641"/>
    <path d="M8 -60 Q18 -74 24 -70" stroke="#d62828" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g></g>`;
}
// מלכודת: מרכז הבסיס ב-(x,y)
function trap(x, y, s = 1) {
  const teeth = d => { let t = ''; for (let i = 0; i < 5; i++) t += `${d * (4 + i * 6)},${i % 2 ? -18 : -24} `; return t; };
  return `<g transform="translate(${x},${y}) scale(${s})">
    <g class="trap-l"><path d="M-34 0 Q-34 -28 -2 -28 L-2 -19 Q-25 -19 -25 0Z" fill="#6b6b6b"/><polyline points="${teeth(-1)}" stroke="#444" stroke-width="2" fill="none"/></g>
    <g class="trap-r"><path d="M34 0 Q34 -28 2 -28 L2 -19 Q25 -19 25 0Z" fill="#6b6b6b"/><polyline points="${teeth(1)}" stroke="#444" stroke-width="2" fill="none"/></g>
    <rect x="-38" y="-2" width="76" height="7" rx="3" fill="#444"/>
    <g fill="none" stroke="#555" stroke-width="2.5"><ellipse cx="46" cy="2" rx="6" ry="4"/><ellipse cx="57" cy="4" rx="6" ry="4"/></g>
  </g>`;
}
function net(x, y) {
  let lines = '';
  for (let i = 0; i <= 8; i++) lines += `<line x1="${x + i * 20}" y1="${y}" x2="${x + i * 20}" y2="${y + 150}"/>`;
  for (let j = 0; j <= 7; j++) lines += `<line x1="${x}" y1="${y + j * 21}" x2="${x + 160}" y2="${y + j * 21}"/>`;
  return `<g class="net"><g stroke="#8b5e3c" stroke-width="3" stroke-linecap="round">${lines}</g></g>`;
}
function heart(x, y, r, delay) {
  return `<path class="star" style="animation-delay:${delay}s,${delay + 1.4}s" fill="#ff6b8b"
    d="M${x} ${y + r} C${x - r * 1.6} ${y - r * .2} ${x - r * .9} ${y - r * 1.4} ${x} ${y - r * .5} C${x + r * .9} ${y - r * 1.4} ${x + r * 1.6} ${y - r * .2} ${x} ${y + r}Z"/>`;
}
function pine(x, y, h) {
  return `<rect x="${x - 5}" y="${y - 22}" width="10" height="22" fill="#7f5539"/>
    <polygon points="${x - h * .38},${y - 18} ${x},${y - h} ${x + h * .38},${y - 18}" fill="#2d6a4f"/>
    <polygon points="${x - h * .3},${y - h * .45} ${x},${y - h * 1.15} ${x + h * .3},${y - h * .45}" fill="#40916c"/>`;
}
function forest() {
  return `<rect width="400" height="300" fill="#d8f3dc"/>
    <ellipse cx="320" cy="62" rx="36" ry="12" fill="#fff" opacity=".9"/>
    ${pine(22, 240, 120)}${pine(378, 240, 130)}${pine(62, 238, 85)}${pine(340, 238, 80)}
    <rect y="235" width="400" height="65" fill="#a7c957"/>
    ${flower(110, 272, '#ffc8dd')}${flower(300, 276, '#ffd166')}`;
}
// כל ציור מקבל שם. השם הזה הוא ה-scene של הדף.
const SCENES = {
  // מיצי והפרפר
  p1: () => `${ground()}${sun(60, 60)}${cat(200, 175)}`,
  p2: () => `${ground()}${sun(60, 60)}${cat(160, 175)}${butterfly(280, 150)}`,
  p3: () => `${ground()}${sun(60, 60)}${cat(200, 175)}${star(90, 140, 14, .2)}${star(320, 120, 18, .5)}${star(260, 60, 12, .8)}${star(130, 70, 10, 1.1)}`,
  // הפרפר הסגול
  b1: () => `${ground()}${sun(60, 60)}${flower(120, 250, '#ffafcc')}${flower(280, 255, '#ffd166')}${butterfly(200, 170, 1.4)}`,
  b2: () => `${ground()}${sun(60, 60)}${bigFlower(200, 245, '#e63946')}${butterfly(330, 90, 1.4)}`,
  // דף הסיום של כל ספר
  end: () => `${ground()}${sun(60, 60)}${cat(200, 175)}${star(80, 130, 16, .1)}${star(330, 130, 16, .3)}${star(200, 40, 14, .5)}`,
  // עורב, צבי וזאב
  f1: () => `${forest()}${deer(115, 175, .95, 1)}${wolf(290, 175, .95, -1)}${raven(205, 105, 1.1)}`,
  f2: () => `${forest()}${wolf(195, 175)}${trap(225, 236)}${raven(320, 80, 1, -1)}`,
  f3: () => `${forest()}${deer(105, 175, .9, 1)}${wolf(270, 175, .9, -1)}${trap(245, 236, .9)}${raven(200, 80, .9)}`,
  f4: () => `${forest()}${deer(205, 175)}${trap(230, 236)}${raven(85, 80, 1)}`,
  f5: () => `${forest()}<g class="run">${wolf(150, 175, .9, -1)}${hunter(275, 175, .95, -1)}${hunter(335, 175, .95, -1)}</g>`,
  f6: () => `${forest()}${deer(195, 175, 1, 1, true)}${trap(225, 236)}${raven(300, 70, 1, -1)}`,
  f7: () => `${forest()}<g class="leap">${deer(170, 175, .95, -1)}</g>${trap(230, 236)}${hunter(310, 175)}${raven(330, 85, .9, -1)}`,
  f8: () => `${forest()}${wolf(185, 175)}${net(105, 95)}${hunter(330, 175, 1, -1)}${raven(300, 75, .9, -1)}`,
  f9: () => `${forest()}${deer(170, 175)}${raven(275, 110, 1.1, -1)}${heart(110, 90, 14, .2)}${heart(300, 170, 12, .5)}${heart(220, 60, 10, .8)}${heart(345, 95, 11, 1.1)}`
};
const svgOf = (scene) => `<svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><g class="scene ${scene}">${SCENES[scene]()}</g></svg>`;

/* =========================================================
   3. השוואת מילים — מסלקת ניקוד ומאפשרת טעויות קטנות
   ========================================================= */
const FINALS = { 'ך': 'כ', 'ם': 'מ', 'ן': 'נ', 'ף': 'פ', 'ץ': 'צ' };
function norm(s) {
  return s.replace(/[֑-ׇ]/g, '')          // ניקוד וטעמים
          .replace(/[ךםןףץ]/g, c => FINALS[c])       // אותיות סופיות
          .replace(/[^א-ת\s]/g, ' ')        // סימני פיסוק
          .trim().split(/\s+/).filter(Boolean);
}
const loose = w => w.replace(/[וי]/g, '');             // כתיב מלא/חסר
function lev(a, b) {
  const d = Array.from({ length: a.length + 1 }, (_, i) => [i]);
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
  return d[a.length][b.length];
}
function similar(heard, target) {
  if (heard === target) return true;
  const a = loose(heard), b = loose(target);
  if (a && a === b) return true;
  const L = Math.max(heard.length, target.length);
  if (L >= 4 && lev(heard, target) <= 1) return true;
  if (L >= 6 && lev(heard, target) <= 2) return true;
  return false;
}
// מיישר את מה שנשמע מול הטקסט, לפי הסדר. מותר לדלג על עד 2 מילים.
function align(heardWords, target) {
  let p = 0; const matched = new Set();
  for (const h of heardWords) {
    for (let k = 0; k < 3 && p + k < target.length; k++) {
      if (similar(h, target[p + k])) { matched.add(p + k); p = p + k + 1; break; }
    }
  }
  return { p, matched };
}
const PASS_RATIO = 0.75; // כמה מהמילים חייבות להיקרא נכון

/* =========================================================
   4. ספרייה — מסך הבחירה
   ========================================================= */
const $ = id => document.getElementById(id);
function finishedSet() {
  try { return new Set(JSON.parse(localStorage.getItem('livebook-finished') || '[]')); } catch (_) { return new Set(); }
}
function markFinished(id) {
  const s = finishedSet(); s.add(id);
  try { localStorage.setItem('livebook-finished', JSON.stringify([...s])); } catch (_) {}
}
function showLibrary() {
  stopListening();
  const fin = finishedSet();
  $('shelf').innerHTML = '';
  BOOKS.forEach(b => {
    const card = document.createElement('button');
    card.className = 'book';
    card.innerHTML = `<span class="cover alive">${svgOf(b.cover)}</span>
      <span class="name">${b.title}</span>
      <span class="meta">${b.pages.length} דפים</span>
      ${fin.has(b.id) ? '<span class="done">⭐ קראתי</span>' : ''}`;
    card.onclick = () => openBook(b);
    $('shelf').appendChild(card);
  });
  $('reader').classList.add('hidden');
  $('library').classList.remove('hidden');
}
function openBook(b) {
  book = b;
  pages = [...b.pages, { text: END_TEXT, scene: b.endScene || 'end', end: true }];
  page = 0;
  $('title').textContent = b.title;
  $('library').classList.add('hidden');
  $('reader').classList.remove('hidden');
  render();
}

/* =========================================================
   5. זיהוי קולי
   ========================================================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false, finalText = '', done = false;
let book = null, pages = [], page = 0, target = [], spans = [];

const stage = $('stage'), textEl = $('text'), micBtn = $('mic'), statusEl = $('status');

function setStatus(t) { statusEl.textContent = t; }
function updateMic() {
  micBtn.classList.toggle('on', listening);
  micBtn.textContent = listening ? '👂' : '🎤';
}

function startListening() {
  if (!SR || done) return;
  if (!rec) {
    rec = new SR();
    rec.lang = 'he-IL';
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = e => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const r = e.results[i];
        if (r.isFinal) finalText += ' ' + r[0].transcript;
        else interim += ' ' + r[0].transcript;
      }
      check(finalText + ' ' + interim);
    };
    rec.onerror = e => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
        listening = false; updateMic();
        setStatus('צריך לאשר גישה למיקרופון בהגדרות של ספארי');
      }
    };
    rec.onend = () => {             // באייפד ההקשבה נעצרת לבד מדי פעם — מפעילים מחדש
      if (listening && !done) setTimeout(() => { try { rec.start(); } catch (_) {} }, 200);
      else updateMic();
    };
  }
  try { rec.start(); } catch (_) {}
  listening = true; updateMic();
  setStatus('אני מקשיב... קראו בקול 📖');
}
function stopListening() {
  listening = false; updateMic();
  try { rec && rec.stop(); } catch (_) {}
}

function check(heard) {
  if (done) return;
  const { p, matched } = align(norm(heard), target);
  spans.forEach((s, i) => {
    s.classList.toggle('ok', matched.has(i));
    s.classList.toggle('next', i === p);
  });
  if (p === target.length && matched.size >= Math.ceil(target.length * PASS_RATIO)) success();
}

/* =========================================================
   6. הצלחה — הציור מתעורר
   ========================================================= */
function success() {
  if (done) return;
  done = true;
  stopListening();
  spans.forEach(s => { s.classList.add('ok'); s.classList.remove('next'); });
  stage.classList.add('alive');
  setStatus('כל הכבוד! 🎉');
  chime(); confetti();
  micBtn.disabled = true;
  const nx = $('next');
  nx.disabled = false;
  nx.classList.add('glow');
}
function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784, 1047].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = f; o.type = 'triangle';
      g.gain.setValueAtTime(.0001, ctx.currentTime + i * .12);
      g.gain.exponentialRampToValueAtTime(.25, ctx.currentTime + i * .12 + .02);
      g.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + i * .12 + .4);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + i * .12); o.stop(ctx.currentTime + i * .12 + .45);
    });
  } catch (_) {}
}
function confetti() {
  const items = ['⭐', '🌟', '✨', '🎈', '💛'];
  for (let i = 0; i < 18; i++) {
    const d = document.createElement('div');
    d.className = 'confetti';
    d.textContent = items[i % items.length];
    d.style.left = Math.random() * 95 + '%';
    d.style.animationDelay = Math.random() * .8 + 's';
    stage.appendChild(d);
    setTimeout(() => d.remove(), 3500);
  }
}

/* =========================================================
   7. החלפת דפים
   ========================================================= */
function render() {
  const pg = pages[page];
  done = false; finalText = '';
  stage.classList.remove('alive');
  stage.innerHTML = svgOf(pg.scene);
  textEl.innerHTML = '';
  spans = []; target = [];
  textEl.classList.toggle('long', pg.text.length > 45);
  $('pageNum').textContent = pg.end ? '⭐' : `${page + 1} / ${pages.length - 1}`;
  $('prev').disabled = page === 0;
  const nx = $('next'); nx.disabled = true; nx.classList.remove('glow');

  if (pg.end) {                       // דף הסיום מתעורר לבד
    textEl.textContent = pg.text;
    micBtn.disabled = true;
    stage.classList.add('alive');
    setStatus('');
    markFinished(book.id);
    setTimeout(() => { chime(); confetti(); }, 300);
    nx.disabled = false; nx.textContent = '↺'; nx.setAttribute('aria-label', 'לקרוא שוב');
    return;
  }
  pg.text.split(/\s+/).filter(t => norm(t).length).forEach((t, i) => {
    const s = document.createElement('span');
    s.className = 'w' + (i === 0 ? ' next' : '');
    s.textContent = t;
    s.onclick = () => sayWord(t);
    textEl.appendChild(s); textEl.append(' ');
    spans.push(s); target.push(norm(t)[0] || '');
  });
  micBtn.disabled = false;
  nx.textContent = '←'; nx.setAttribute('aria-label', 'הדף הבא');
  setStatus(SR ? 'לחצו על המיקרופון והתחילו לקרוא' : 'הדפדפן הזה לא תומך בזיהוי קולי. פתחו בספארי באייפד.');
}

// לחיצה על מילה — האייפד מקריא אותה (עוזר לילד שנתקע)
function sayWord(w) {
  if (!('speechSynthesis' in window)) return;
  const wasListening = listening;
  if (wasListening) stopListening();     // שהמיקרופון לא "ישמע" את ההקראה
  const u = new SpeechSynthesisUtterance(w);
  u.lang = 'he-IL'; u.rate = .8;
  u.onend = () => { if (wasListening && !done) startListening(); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

micBtn.onclick = () => listening ? stopListening() : startListening();
$('next').onclick = () => {
  stopListening();
  if (pages[page].end) page = 0; else page++;
  render();
};
$('prev').onclick = () => { stopListening(); if (page > 0) { page--; render(); } };
$('skip').onclick = () => { if (!pages[page].end) success(); };
$('home').onclick = showLibrary;

showLibrary();
</script>
